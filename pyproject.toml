[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-drafter-cli"
version = "0.1.0"
description = "Draft an honest CHANGELOG.md from git history: commits and tags since your last release, grouped into Added/Changed/Fixed."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["changelog", "git", "release-notes", "local-first", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
changelog-drafter = "changelog_drafter.cli:main"

[tool.setuptools.packages.find]
include = ["changelog_drafter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
